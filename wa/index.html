     Descubrió que quien le pica al RECUADRO en vez de al link de texto termina

<!-- ══════════════════════════════════════════════════════════════════════════
     LA ESCALA AL WHATSAPP — cuenta el clic y avienta a la persona a WhatsApp.

     Keno, 21 ago 2026: «¿podríamos medir cuántas personas se metieron a ese
     link?». wa.me no da ninguna estadística y Facebook no reporta clics dentro
     de comentarios (solo en anuncios pagados), así que hay que poner una escala
     propia en medio.

     LA REGLA QUE MANDA EN TODO: **el brinco a WhatsApp NUNCA espera al contador.**
     Si Firebase está caído, si el navegador bloquea el fetch, si no hay señal
     para esa llamada — la persona llega a WhatsApp igual. El conteo se dispara
     con keepalive (la llamada se completa aunque la página ya se haya ido) y el
     brinco sale de inmediato. Un cliente perdido cuesta más que un clic no contado.
     Con JavaScript apagado, el <meta refresh> de abajo lo brinca solito.

     LA LIGA:  https://fotonas.tractopartes.com/wa/?v=puertas-tractocamion
     El `v` sirve para DOS cosas a la vez: es la etiqueta que se cuenta (así se
     sabe qué video jaló más) y de ahí sale el mensaje que la persona manda ya
     escrito, para que quien atiende sepa de cuál video vino sin preguntar.

     SIN EMOJI A PROPÓSITO: se probó con 👋 y el redirector de WhatsApp lo
     entrega roto (sale «�»). El archivo lo manda bien codificado — se comprobó
     que llega %F0%9F%91%8B — pero wa.me lo mastica. Un mensaje limpio sin emoji
     se ve mejor que uno con un cuadrito roto.

     La base solo deja CREAR clics: desde afuera no se pueden leer, ni modificar,
     ni borrar. Probado en los dos sentidos el 21 ago 2026.
     ══════════════════════════════════════════════════════════════════════════ -->

<script>
  var TEL  = "528121529279";
  var BASE = "https://tpm-clics-wa-default-rtdb.firebaseio.com";

  var P = new URLSearchParams(location.search);
  // se acepta v (el nuevo) y o (por si alguna liga vieja anda por ahí)
  var etiqueta = (P.get("v") || P.get("o") || "sin-origen").slice(0, 60);
  var red = (P.get("r") || "").slice(0, 20);

  // "puertas-tractocamion" -> "PUERTAS TRACTOCAMION"
  // Si la etiqueta es una clave de fecha (20260807-142829) no sirve para el
  // mensaje — saldria "vi el video de 20260807 142829". Se cuenta igual, pero
  // la persona manda el saludo generico.
  var esClave = /^\d{6,8}[-_]?\d{4,6}$/.test(etiqueta);
  var bonito = etiqueta.replace(/[-_]+/g, " ").trim().toUpperCase();
  var saludo = (etiqueta === "sin-origen" || esClave || !bonito)
    ? "Hola, vi su publicacion y quiero informacion"
    : "Hola, vi el video de " + bonito + " y quiero informacion";

  var destino = "https://wa.me/" + TEL + "?text=" + encodeURIComponent(saludo);

  // El conteo se dispara SIN esperarlo.
  try {
    fetch(BASE + "/clics/" + new Date().toISOString().slice(0, 10) + ".json", {
      method: "POST",
      keepalive: true,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ t: Date.now(), o: etiqueta, r: red })
    }).catch(function () {});
  } catch (e) {}

  // ── POR QUÉ EN CELULAR NO SE BRINCA SOLO (21 ago 2026, cachado por Keno) ──
  // iOS abre la app de WhatsApp de golpe cuando la PERSONA le pica a un link de
  // wa.me (universal link). Pero un brinco hecho por codigo NO cuenta como toque
  // del usuario: iOS no abre la app y la deja en la pantalla de api.whatsapp.com
  // con un boton «Abrir aplicacion»... que trae junto un «Descargala ahora».
  // Keno acabo en la pagina de descarga de WhatsApp. Un paso de mas justo donde
  // mas duele.
  //
  // Entonces: en CELULAR se pinta un boton grande y el toque es suyo de verdad
  // — asi iOS si abre la app directo. En COMPUTADORA no hay app que abrir, asi
  // que ahi si conviene brincar solo y no cobrarle un clic de mas.
  var esMovil = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent || "");
  if (!esMovil) location.replace(destino);
</script>

    } catch (e) {}
  </script>
