<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tractopartes Magaña — WhatsApp</title>

<!-- ══════════════════════════════════════════════════════════════════════════
     LA ESCALA AL WHATSAPP — cuenta el clic y avienta a la persona a WhatsApp.

     Keno, 21 ago 2026: «¿podríamos medir cuántas personas se metieron a ese link?».
     wa.me no da ninguna estadística y Facebook no reporta clics de comentarios,
     así que hay que poner una escala propia en medio.

     LA REGLA QUE MANDA EN TODO: **el brinco a WhatsApp NUNCA espera al contador.**
     Si Firebase está caído, si no hay internet para esa llamada, si el navegador
     bloquea el fetch — la persona llega a WhatsApp igual. Se cuenta con
     keepalive (la llamada sobrevive aunque la página ya se haya ido) y el brinco
     sale de inmediato. Un cliente perdido cuesta más que un clic no contado.

     Y si el navegador trae JavaScript apagado, el <meta refresh> de abajo lo
     brinca solito en 0 segundos. Ahí no se cuenta, pero llega.

     La base solo deja CREAR clics: no se pueden leer, ni modificar, ni borrar
     desde afuera. Probado en los dos sentidos el 21 ago 2026.
     ══════════════════════════════════════════════════════════════════════════ -->

<script>
  var TEL   = "528121529279";
  var BASE  = "https://tpm-clics-wa-default-rtdb.firebaseio.com";

  // de dónde viene: ?o=puertas-tractocamion  (lo pone el comentario de cada publicación)
  var P = new URLSearchParams(location.search);
  var origen = (P.get("o") || "sin-origen").slice(0, 60);
  var red    = (P.get("r") || "").slice(0, 20);

  // El mensaje ya escrito: así, en cuanto la persona escribe, tú ves de cuál
  // video vino sin tener que preguntarle.
  var titulo = (P.get("t") || "").slice(0, 80);
  var saludo = titulo
    ? "Hola, vi el video de " + titulo + " y quiero información 👋"
    : "Hola, vi su publicación y quiero información 👋";

  var destino = "https://wa.me/" + TEL + "?text=" + encodeURIComponent(saludo);

  // Se dispara el conteo SIN esperarlo. keepalive:true = la llamada se completa
  // aunque la página ya se haya ido a WhatsApp.
  try {
    fetch(BASE + "/clics/" + new Date().toISOString().slice(0, 10) + ".json", {
      method: "POST",
      keepalive: true,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ t: Date.now(), o: origen, r: red })
    }).catch(function () {});
  } catch (e) {}

  // El brinco sale YA, sin esperar nada.
  location.replace(destino);
</script>

<!-- Red de seguridad: sin JavaScript, esto lo brinca de todos modos. -->
<noscript><meta http-equiv="refresh" content="0;url=https://wa.me/528121529279"></noscript>

<style>
  html,body{margin:0;height:100%;background:#0D0D12;color:#F4F4F7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;}
  .m{font-weight:800;font-size:19px;color:#F00810;letter-spacing:-.02em;}
  .s{color:#9B9BAE;font-size:14px;}
  .b{margin-top:6px;display:inline-block;background:#25D366;color:#fff;text-decoration:none;
     font-weight:800;font-size:15px;padding:13px 26px;border-radius:999px;}
</style>
</head>
<body>
  <div class="c">
    <div class="m">TRACTOPARTES MAGAÑA</div>
    <div class="s">Abriendo WhatsApp…</div>
    <!-- Si por lo que sea no brincó solo, que la persona tenga en qué picarle. -->
    <a class="b" id="liga" href="https://wa.me/528121529279">Abrir WhatsApp</a>
  </div>
  <script>
    // que el botón de auxilio lleve el mismo mensaje pre-escrito
    try { document.getElementById("liga").href = destino; } catch (e) {}
  </script>
</body>
</html>
